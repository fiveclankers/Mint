# --- FONT SETTINGS ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- WINDOW & BLUR (The ML4W Aesthetic) ---
window_padding_width  15
background_opacity    0.70
background_blur       1
confirm_os_window_close 0

# --- ML4W DYNAMIC THEMING ---
# If you ever install Pywal/Wallust to get the true ML4W shifting colors, 
# remove the "#" from the line below:
# include ~/.cache/wal/colors-kitty.conf

# --- STATIC FALLBACK COLORS (Tokyo Night) ---
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #283457

# Cursor
cursor #c0caf5
cursor_text_color #1a1b26
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Black
color0 #15161e
color8 #414868
# Red
color1 #f7768e
color9 #f7768e
# Green
color2 #9ece6a
color10 #9ece6a
# Yellow
color3 #e0af68
color11 #e0af68
# Blue
color4 #7aa2f7
color12 #7aa2f7
# Magenta
color5 #bb9af7
color13 #bb9af7
# Cyan
color6 #7dcfff
color14 #7dcfff
# White
color7 #a9b1d6
color15 #c0caf5

# --- KEYBINDINGS ---
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
